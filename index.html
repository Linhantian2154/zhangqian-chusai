<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="../manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物角色扮演 · 张骞出塞 · 完整版（三幕）</title>
<style>
:root{
  --bg:#fdf6e3; --card:#fff; --ink:#3d3a2e; --gold:#d4a017; --gold2:#b8860b;
  --sky:#8ecae6; --desert:#e9c46a; --green:#2a9d8f; --danger:#e07a5f; --night:#264653;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(180deg,#fdf6e3 0%,#f5e9c8 100%);
  color:var(--ink); min-height:100vh;
}
.app{max-width:720px; margin:0 auto; padding:14px;}

/* 顶栏：行囊 */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--card); border-radius:16px; padding:10px 14px;
  border:2px solid var(--gold); margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .logo{font-size:1.5rem;}
.brand h1{font-size:1.05rem; line-height:1.2;}
.brand .sub{display:block; font-size:.68rem; color:#8a8578; font-weight:400;}
.bag-btn{
  background:#fff3d8; border:2px solid var(--gold); border-radius:999px;
  padding:6px 14px; font-size:.85rem; cursor:pointer; color:var(--gold2); font-weight:700;
}
.bag-btn:hover{background:#ffe9b8;}

/* 说书人 */
.narrator{display:flex; gap:10px; align-items:flex-start; margin-bottom:14px;}
.narrator .avatar{font-size:2.6rem; line-height:1;}
.narrator .bubble{
  flex:1; background:var(--card); border-radius:16px; padding:14px 16px;
  border:2px solid #e8dcc0; font-size:1.02rem; line-height:1.75; box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.narrator .who{display:block; font-size:.72rem; color:#a89c80; margin-bottom:4px; font-weight:700;}

/* 场景大图 */
.scene{
  background:var(--card); border-radius:16px; border:2px solid #e8dcc0;
  padding:14px; margin-bottom:14px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.scene .big{font-size:3.6rem; margin-bottom:6px;}
.scene .place{font-size:.8rem; color:#a89c80;}

/* 地图（路线决策用） */
.mapbox{
  background:linear-gradient(180deg,#bfe3f2 0%,#f4e3bb 70%,#e9c46a 100%);
  border-radius:14px; padding:10px; margin-top:10px; position:relative; min-height:150px;
  border:2px solid #d8cba8;
}
.mapbox .m-title{font-size:.78rem; font-weight:700; color:#5b7a8c; margin-bottom:6px; text-align:left;}
.maprow{display:flex; align-items:center; justify-content:space-between; gap:4px; flex-wrap:nowrap;}
.mstop{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:52px;}
.mstop .pin{font-size:1.6rem;}
.mstop .nm{font-size:.62rem; font-weight:700; color:#3d3a2e; background:#fff9; border-radius:999px; padding:1px 6px;}
.mstop .note{font-size:.6rem; color:#7a6f55;}
.mpath{flex:1; height:3px; background:#b8860b88; position:relative; min-width:14px;}
.mpath::after{content:"🐫"; position:absolute; top:-9px; left:40%; font-size:1rem;}
.mpath.off{background:#ccc8bb;}
.mstop.mount .pin{font-size:2rem;}
.mstop.mount .nm{background:#d8eef9;}
.mstop.well .pin{font-size:1.4rem;}

/* 选项 */
.choices{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
.choice{
  background:var(--card); border:2.5px solid #e0d5b5; border-radius:14px;
  padding:13px 16px; font-size:.98rem; line-height:1.55; cursor:pointer; text-align:left;
  color:var(--ink); transition:all .15s; display:flex; align-items:flex-start; gap:10px;
}
.choice:hover{border-color:var(--gold); background:#fffdf5; transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.07);}
.choice .c-ico{font-size:1.5rem; flex-shrink:0;}
.choice.disabled{opacity:.5; pointer-events:none;}

/* 后果反馈 */
.feedback{
  background:#fff; border-radius:16px; border:2px solid var(--gold);
  padding:16px; margin-top:14px; font-size:1rem; line-height:1.75;
  animation:popIn .35s ease; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.feedback.knowledge{border-color:#2a9d8f; background:#f2fbf8;}
.feedback.bad{border-color:#e07a5f; background:#fdf3f0;}
.feedback h4{font-size:.85rem; margin-bottom:6px; color:#8a8578;}
.feedback .k-title{font-size:1.05rem; font-weight:800; color:var(--green); margin-bottom:4px;}

/* 继续按钮 */
.next-btn{
  margin-top:14px; width:100%; padding:14px; font-size:1.05rem; font-weight:800;
  background:linear-gradient(180deg,var(--gold),var(--gold2)); color:#fff;
  border:none; border-radius:14px; cursor:pointer; box-shadow:0 4px 0 #8a6d12;
  transition:all .12s;
}
.next-btn:hover{filter:brightness(1.06);}
.next-btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a6d12;}
.next-btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}

/* 行囊弹窗 */
dialog{
  border:none; border-radius:18px; padding:0; max-width:520px; width:90%;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
dialog::backdrop{background:rgba(30,40,60,.55);}
.dialog-pad{padding:20px;}
.dialog-pad h2{font-size:1.1rem; margin-bottom:12px; color:var(--gold2);}
.item-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
.item{background:#fdf9ee; border:2px solid #e8dcc0; border-radius:12px; padding:10px; text-align:center;}
.item .i-ico{font-size:2rem; display:block; margin-bottom:4px;}
.item .i-nm{font-size:.78rem; font-weight:700;}
.item.locked{opacity:.35; filter:grayscale(.8);}
.item.locked .i-ico{content:"❓";}
.close-btn{width:100%; padding:12px; font-size:.95rem; font-weight:700; background:#f0ead8; border:none; border-radius:12px; cursor:pointer; color:#6b6350;}

/* 出使记录 */
.record{
  background:#fff; border-radius:18px; border:3px solid var(--gold); padding:20px; margin-top:14px;
  animation:popIn .4s ease; box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.record h3{text-align:center; font-size:1.2rem; color:var(--gold2); margin-bottom:12px;}
.record .r-row{font-size:.98rem; line-height:1.8; margin-bottom:8px;}
.record .r-row b{color:var(--ink);}
.record .seal{text-align:center; margin-top:14px; font-size:.95rem; color:#6b6350;}
.record .seal b{font-size:1.1rem; color:var(--gold2);}
.sig-input{
  width:100%; padding:12px; border:2px solid #e0d5b5; border-radius:12px; font-size:1rem;
  margin-top:8px; font-family:inherit;
}
.sig-input:focus{outline:none; border-color:var(--gold);}

/* 动画 */
@keyframes popIn{from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}

/* 进度点 */
.progress{display:flex; gap:6px; justify-content:center; margin-bottom:12px;}
.dot{width:10px; height:10px; border-radius:50%; background:#e0d5b5; transition:all .3s;}
.dot.on{background:var(--gold); transform:scale(1.2);}
.dot.done{background:#2a9d8f;}
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">🐫</span>
      <h1>张骞出塞<span class="sub">历史人物角色扮演 · 完整三幕</span></h1>
    </div>
    <button class="bag-btn" id="bagBtn">🎒 行囊 <span id="bagCount">0</span>/6</button>
  </header>

  <!-- 进度点 -->
  <div class="progress" id="progress"></div>

  <!-- 主舞台 -->
  <main id="stage"></main>

  <!-- 行囊弹窗 -->
  <dialog id="bagDialog">
    <div class="dialog-pad">
      <h2>🎒 我的行囊</h2>
      <div class="item-grid" id="bagGrid"></div>
      <button class="close-btn" id="closeBag">收好行囊 👍</button>
    </div>
  </dialog>
</div>

<script>
/* ================= 音效 ================= */
const sfx = {
  audioCtx:null,
  beep(freq,dur,type,vol){
    try{
      this.audioCtx = this.audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=this.audioCtx.createOscillator(), g=this.audioCtx.createGain();
      o.type=type||"sine"; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||.08, this.audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, this.audioCtx.currentTime+dur);
      o.connect(g); g.connect(this.audioCtx.destination);
      o.start(); o.stop(this.audioCtx.currentTime+dur);
    }catch(e){}
  },
  move(){ this.beep(520,.08,"triangle"); },
  good(){ this.beep(660,.12,"sine"); setTimeout(()=>this.beep(880,.15,"sine"),90); },
  star(){ this.beep(1040,.1,"triangle",.1); },
  bad(){ this.beep(220,.2,"sawtooth",.06); },
  secret(){ [660,780,990,1320].forEach((f,i)=>setTimeout(()=>this.beep(f,.14,"triangle",.09),i*110)); }
};

/* ================= 引擎 ================= */
let cur = 0;           // 当前节点下标
let name = "";         // 孩子名字
let wrongPicks = 0;    // 选错次数
const picked = new Set(); // 已收集物品去重

const $ = (id)=>document.getElementById(id);
const stage = $("stage");

function renderNode(i){
  cur = i;
  const n = STORY[i];
  // 进度点
  const prog = $("progress");
  prog.innerHTML = STORY.map((_,idx)=>`<span class="dot ${idx<i?"done":idx===i?"on":""}"></span>`).join("");
  // 舞台
  let html = "";
  html += `<div class="narrator"><div class="avatar">${n.scene||"📜"}</div><div class="bubble"><span class="who">${n.who||"📜 说书人"}</span>${n.narrator}</div></div>`;
  if(n.map){
    html += `<div class="mapbox"><div class="m-title">${n.map.title}</div><div class="maprow">`;
    n.map.stops.forEach((s,idx)=>{
      html += `<div class="mstop ${s.cls||""}"><span class="pin">${s.ico}</span><span class="nm">${s.nm}</span><span class="note">${s.note||""}</span></div>`;
      if(idx < n.map.stops.length-1) html += `<div class="mpath ${idx>=n.map.highlight?"off":""}"></div>`;
    });
    html += `</div></div>`;
  }
  html += `<div class="choices" id="choices"></div>`;
  stage.innerHTML = html;

  const cbox = $("choices");
  n.choices.forEach((c,idx)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="c-ico">${c.ico}</span><span>${c.text}</span>`;
    btn.addEventListener("click", ()=>choose(n, c, btn));
    cbox.appendChild(btn);
  });
}

function choose(n, c, btn){
  sfx.move();
  // 禁用所有选项
  document.querySelectorAll(".choice").forEach(b=>b.classList.add("disabled"));
  // 物品
  if(c.item && !owned.has(c.item)){
    owned.add(c.item);
    updateBag();
    sfx.star();
  }
  // 知识卡/后果
  if(c.kTitle){
    const fb = document.createElement("div");
    fb.className = "feedback knowledge" + (c.good===false?" bad":"");
    fb.innerHTML = `<h4>${c.good===false?"🧠 线索":"✨ 你获得了知识"}</h4><div class="k-title">${c.kTitle}</div><div>${c.kBody}</div>`;
    stage.appendChild(fb);
  }
  if(c.good===false) wrongPicks++;
  // 下一个
  const nb = document.createElement("button");
  nb.className = "next-btn";
  nb.textContent = (c.next==="end") ? "查看我的出使记录 📜" : "继续 ▶";
  nb.addEventListener("click", ()=>{
    sfx.move();
    if(c.next==="end"){ renderEnd(); }
    else { renderNode(STORY.findIndex(x=>x.id===c.next)); }
  });
  stage.appendChild(nb);
}

/* ================= 行囊 ================= */
function updateBag(){
  $("bagCount").textContent = owned.size;
}
function renderBag(){
  const grid = $("bagGrid");
  grid.innerHTML = Object.entries(ITEMS).map(([k,v])=>{
    const got = owned.has(k);
    return `<div class="item ${got?"":"locked"}"><span class="i-ico">${got?v.ico:"❓"}</span><span class="i-nm">${got?v.nm:"???"}</span><span style="font-size:.62rem;color:#a89c80;display:block;">${got?("已收入行囊"):"还没得到"}</span></div>`;
  }).join("");
  $("bagDialog").showModal();
}
$("bagBtn").addEventListener("click",()=>{ sfx.move(); renderBag(); });
$("closeBag").addEventListener("click",()=>$("bagDialog").close());

/* ================= 结局：出使记录 ================= */
function renderEnd(){
  stage.innerHTML = "";
  const prog = $("progress");
  prog.innerHTML = STORY.map(()=>`<span class="dot done"></span>`).join("");

  const got = [...owned].map(k=>ITEMS[k]);
  const rank = owned.size>=7 ? "🏆 凿空西域的传奇使者" : owned.size>=5 ? "⭐ 勇敢的探索者" : owned.size>=3 ? "🌱 新晋使者" : "🕯️ 初出茅庐的小使者";

                   owned.size>=5 ? "你做出了关键的选择，像一个真正的使者了！" :
                   owned.size>=3 ? "你踏上了出使之路，胆量可嘉，下次把见闻带全！" :
                   "你刚上路就回来了——再来一次，把张骞的旅程走完！";

  const nameHtml = !name ? `<input class="sig-input" id="nameInput" placeholder="写下你的名字，小使者 ✍️" maxlength="12"><button class="next-btn" id="nameBtn" style="margin-top:8px;">署名 📜</button>` :
    `<b>${name}</b>`;

  stage.innerHTML = `
    <div class="record">
      <h3>📜 我的出使记录（13年）</h3>
      <div class="r-row">🧭 <b>我扮演的角色：</b>张骞，大汉使者</div>
      <div class="r-row">🎯 <b>我的使命：</b>出使西域，联络大月氏，共同对付匈奴</div>
      <div class="r-row">🐫 <b>我的旅程：</b>长安 → 河西走廊（贴着祁连山走）→ 被匈奴扣留十年 → 翻过葱岭 → 大宛 → 大月氏 → 回到长安</div>
      <div class="r-row">🎒 <b>我带回来的（${owned.size}/8）：</b>${got.map(v=>v.ico+v.nm).join("、")||"空空的"}</div>
      <div class="r-row">🤔 <b>我明白的：</b>①河西走廊=祁连山雪水浇出的绿洲链，所以商队只能贴山走；②葱岭太高，所以翻越要快走快过；③大月氏不想打仗，但张骞把西域看清了——这就叫凿空西域</div>
      <div class="r-row">🗣️ <b>说给爸妈听：</b>张骞是第一个走进西域的汉朝人。他被匈奴扣了十年也不放弃，翻过世界屋脊帕米尔高原找到大月氏，虽然没谈成联盟，却带回了西域的地图和见闻——从此丝绸之路正式开通。他一个人的坚持，改变了一个国家的眼界。</div>
      <div style="margin-top:12px; padding:12px; border-radius:14px; background:#fff3d8; border:2px solid var(--gold);"><b>${rank}</b><br>${rankLine}</div>
      <div class="seal">—— 小使者 ${nameHtml} 的出使记录 ✍️</div>
      <button class="next-btn" id="restartBtn" style="margin-top:16px; background:linear-gradient(180deg,#5aa9a0,#2a9d8f); box-shadow:0 4px 0 #1c6b62;">🔄 重新出使（再玩一次）</button>
      <button class="next-btn" id="teaseBtn" style="margin-top:10px; background:linear-gradient(180deg,#8e6bb8,#6d4d96); box-shadow:0 4px 0 #4a3568;">🔜 下一个故事：郑和下西洋 ⛵（剧场里可玩）</button>
    </div>`;
  sfx.good();

  $("nameBtn")?.addEventListener("click",()=>{
    name = $("nameInput").value.trim() || "小使者";
    renderEnd();
  });
  $("restartBtn").addEventListener("click",()=>{ location.reload(); });
  /* ===== 通关记录（localStorage）===== */
  try{
    const done = JSON.parse(localStorage.getItem("shiguang_story_progress") || "{}");
    done["zhangqian"] = { done:true, at:Date.now(), rank:rank };
    localStorage.setItem("shiguang_story_progress", JSON.stringify(done));
    /* ===== 全局物品收集（图鉴）===== */
    const all = JSON.parse(localStorage.getItem("shiguang_items") || "{}");
    [...owned].forEach(k=>{ all["zhangqian_"+k] = ITEMS[k].nm; });
    localStorage.setItem("shiguang_items", JSON.stringify(all));
  }catch(e){}
  $("teaseBtn").addEventListener("click",()=>{ sfx.secret(); alert("🎉 张骞的故事讲完了！快去剧场玩《郑和下西洋》：他靠着季风，开着比足球场还大的宝船驶向大海！"); });
}

/* ================= 启动 ================= */
renderNode(0);
updateBag();
</script>

  var fab = document.createElement("button");
  fab.id = "installFab";
  fab.textContent = isIOS ? "📲 添加到主屏幕" : "📲 安装App";
  fab.style.cssText = "position:fixed;right:14px;bottom:18px;z-index:999;background:linear-gradient(180deg,#2a9d8f,#1c6b62);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:.95rem;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;";
  document.body.appendChild(fab);

  fab.addEventListener("click", function(){
    if(dPrompt){ dPrompt.prompt(); dPrompt.userChoice.then(function(r){ if(r.outcome==="accepted") fab.remove(); }); }
    else if(isIOS){ alert("iPhone/iPad：点浏览器底部的「分享」按钮（方框+箭头），再选「添加到主屏幕」即可。"); }

})();
